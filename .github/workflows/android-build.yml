name: Android Build

# Runs the headless test suite, then exports Android builds (arm64-v8a + armeabi-v7a):
# a debug APK and a Gradle-built App Bundle (.aab, for Google Play) on every push/PR.
# With the ANDROID_KEYSTORE_* secrets configured, the APK and AAB are release-signed.
# Tag `v*` to publish a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"
  GODOT_BIN: /home/runner/godot/godot

jobs:
  test:
    name: Tests + perf budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /home/runner/godot
          key: godot-editor-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/godot && cd /home/runner/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip

      - name: Import project
        run: ${GODOT_BIN} --headless --path . --import

      - name: Boot main scene (script/scene load check)
        run: |
          ${GODOT_BIN} --headless --path . --quit-after 120 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load" boot.log; then exit 1; fi

      - name: Run test suites (phases 1–11)
        run: |
          # timeout: a script parse error leaves the runner idling instead of quitting.
          set -o pipefail
          for suite in run_phase1_tests run_phase2_tests run_phase3_tests run_phase4_tests run_phase5_tests run_phase6_tests run_phase7_tests run_phase8_tests run_phase9_tests run_phase10_tests run_phase11_tests; do
            echo "::group::$suite"
            timeout 400 ${GODOT_BIN} --headless --path . --fixed-fps 60 res://tests/$suite.tscn 2>&1 | tee $suite.log
            echo "::endgroup::"
            if grep -E "SCRIPT ERROR|Parse Error" $suite.log; then exit 1; fi
            echo "**$suite:** $(grep -E 'passed, .* failed' $suite.log)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Install virtual display + Mesa (for the perf probe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      - name: Performance budget probe (draw calls, traffic pool)
        env:
          PERF_REPORT: perf.md
        run: |
          set -o pipefail
          for scene in main_chennai main_phase1_greybox; do
            PROBE_SCENE=res://scenes/$scene.tscn timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" ${GODOT_BIN} --path . \
              --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 \
              res://tests/run_perf_probe.tscn 2>&1 | tee perf-$scene.log
            cat perf.md >> "$GITHUB_STEP_SUMMARY"
          done

  android:
    name: Export Android APK + AAB
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.GODOT_VERSION }}

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/godot && cd /home/runner/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d /tmp/tpl
          # Keep only what Android needs to stay well inside the cache limit.
          cp /tmp/tpl/templates/android_* /tmp/tpl/templates/version.txt "$TPL_DIR"/
          rm -rf /tmp/tpl templates.tpz

      - name: Configure Android SDK + debug keystore for Godot
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using Android SDK at $SDK, Java at $JAVA_HOME"
          ls "$SDK/build-tools" | tail -3
          mkdir -p ~/.config/godot
          for f in editor_settings-4.4.tres editor_settings-4.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Stamp version code
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Import project
        run: ${GODOT_BIN} --headless --path . --import

      - name: Export debug APK
        run: |
          mkdir -p build/android
          ${GODOT_BIN} --headless --path . --export-debug "Android" build/android/NammaAuto-debug.apk 2>&1 | tee export.log
          test -f build/android/NammaAuto-debug.apk || { echo "::error::Debug APK was not produced"; exit 1; }
          ls -lh build/android/

      - name: Verify APK contains the Chennai map data
        run: |
          python3 - <<'PY'
          import zipfile, json, re, sys
          z = zipfile.ZipFile("build/android/NammaAuto-debug.apk")
          names = z.namelist()
          # Godot's Android export stores project files under assets/ (or inside a .pck).
          blob = "\n".join(names).encode() + b"".join(z.read(n) for n in names if n.endswith(".pck"))
          expected = len(json.load(open("data/world/manifest.json"))["chunks"])
          found = len(set(re.findall(rb"data/world/chunks/c_-?\d+_-?\d+\.json", blob)))
          ok = b"data/world/manifest.json" in blob and b"data/world/road_graph.json" in blob and found >= expected
          print(f"manifest/graph present: {ok}, chunk files {found}/{expected}")
          sys.exit(0 if ok else 1)
          PY

      - name: Export signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          ${GODOT_BIN} --headless --path . --export-release "Android" build/android/NammaAuto-release.apk
          test -f build/android/NammaAuto-release.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Export Android App Bundle (.aab, Gradle build)
        timeout-minutes: 25
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          # --install-android-build-template only works together with an --export-* flag
          # (on its own it opens the editor and never exits).
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
            ${GODOT_BIN} --headless --path . --install-android-build-template --export-release "Android AAB" build/android/NammaAuto-release.aab 2>&1 | tee aab.log
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            # No upload key yet: a debug-signed bundle still proves the Play Store pipeline works.
            ${GODOT_BIN} --headless --path . --install-android-build-template --export-debug "Android AAB" build/android/NammaAuto-debug.aab 2>&1 | tee aab.log
          fi
          ls -lh build/android/*.aab || { echo "::error::AAB was not produced"; tail -50 aab.log; exit 1; }

      - name: Report APK size (budget < 85 MB)
        run: |
          SIZE=$(stat -c %s build/android/NammaAuto-debug.apk)
          echo "Debug APK: $((SIZE / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          for f in build/android/*.aab; do echo "$(basename $f): $(( $(stat -c %s $f) / 1024 / 1024 )) MB" | tee -a "$GITHUB_STEP_SUMMARY"; done

      - uses: actions/upload-artifact@v5
        with:
          name: NammaAuto-android-${{ github.run_number }}
          path: |
            build/android/*.apk
            build/android/*.aab
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/android/*.apk
            build/android/*.aab
