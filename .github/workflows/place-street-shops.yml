name: Place Roadside Street Shops

# Re-places tea stalls, fruit carts and biryani stalls (tools/osm/append_street_shops.py) on
# collision-clear kerbs in the existing map and commits data/world/city_props.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  place:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate roadside shop placements in collision-clear plots
        run: python3 tools/osm/append_street_shops.py
      - name: Verify generated shops
        run: python3 -m unittest discover -s tests -p 'test_city_density.py' -k StreetShops -v
      - name: Commit placements
        run: |
          git config user.name "street-shops[bot]"
          git config user.email "street-shops@users.noreply.github.com"
          git add data/world/city_props.json
          if git diff --cached --quiet; then echo "Already current"; exit 0; fi
          git commit -m "data(world): re-place roadside street shops"
          git pull --rebase
          git push
